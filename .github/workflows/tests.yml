name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # CPU-only PyTorch, so the CNN and the C kernel bit-exact test run here too
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install fastapi httpx
      # The CWRU files are not in the repo (140 MB). Tests that need them skip;
      # the DSP tests run on synthetic signals with known answers.
      - run: python -m pytest -q -rs
