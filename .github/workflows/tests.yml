name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # CPU-only PyTorch, so the CNN and the C kernel bit-exact test run here too
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install fastapi httpx
      # The CWRU files are not in the repo (140 MB). Tests that need them skip;
      # the DSP tests run on synthetic signals with known answers.
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -q -rs --tb=short 2>&1 | tee pytest.log || {
            # put the end of the output in annotations, readable on the run page
            # even when pytest dies before printing its summary
            echo "::error title=pytest output (last 40 lines)::$(tail -n 40 pytest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
