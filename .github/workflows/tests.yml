name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # CPU-only PyTorch, so the CNN and the C kernel bit-exact test run here too
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install fastapi httpx
      # The CWRU files are not in the repo (140 MB). Tests that need them skip;
      # the DSP tests run on synthetic signals with known answers.
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs --tb=short 2>&1 | tee pytest.log || {
            # turn each failure into an annotation, readable on the run page
            grep -E "^(FAILED|ERROR) " pytest.log | head -20 | sed 's/^/::error::/'
            grep -E "^E  " pytest.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
